name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.3'
        dependency-version:
          - prefer-stable
          - prefer-lowest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, fileinfo, redis, pdo, sqlite3
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-progress --no-interaction

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Run PHPStan
        if: matrix.dependency-version == 'prefer-stable'
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always
