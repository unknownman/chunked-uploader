<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resumable Chunked Upload</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6f5;
      --surface: #ffffff;
      --border: #d9e3df;
      --accent: #176b55;
      --accent-strong: #0f4d3c;
      --accent-soft: #e8f5f0;
      --text: #16322c;
      --muted: #5e7870;
      --danger: #b3261e;
      --radius: 14px;
      --shadow: 0 18px 50px rgba(23, 43, 36, 0.10);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    main {
      width: min(720px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
    }
    p.subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    #drop-zone {
      border: 2px dashed #5c9b88;
      border-radius: 12px;
      padding: 56px 20px;
      text-align: center;
      cursor: pointer;
      background: var(--accent-soft);
      transition: background 0.15s ease, border-color 0.15s ease;
      color: var(--accent-strong);
      font-weight: 500;
    }
    #drop-zone.dragging {
      background: #cdeadd;
      border-color: var(--accent);
    }
    #drop-zone small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-weight: 400;
    }
    input[type="file"] { display: none; }
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    button {
      border: 0;
      border-radius: 9px;
      padding: 10px 18px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.92rem;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    button:hover { background: var(--accent-strong); }
    button:active { transform: translateY(1px); }
    button[disabled] { opacity: .45; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    button.secondary:hover { background: var(--accent-soft); }
    progress {
      width: 100%;
      height: 16px;
      margin-top: 24px;
      accent-color: var(--accent);
      border-radius: 8px;
      border: 0;
    }
    #percent {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 6px;
    }
    #status {
      min-height: 26px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    #log {
      margin-top: 20px;
      padding: 14px;
      background: #0d1f1a;
      color: #9fd8c4;
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      max-height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }
    #log:empty { display: none; }
    .file-meta { margin-top: 16px; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Resumable upload</h1>
    <p class="subtitle">Chunked, resumable and dependency-free — powered by native <code>File</code>, <code>Blob.slice()</code> and the Fetch API.</p>

    <div id="drop-zone" role="button" tabindex="0" aria-label="Drop a file or click to choose">
      Drop a file here or click to choose
      <small>Files are split into 2&nbsp;MiB chunks and can be resumed later</small>
    </div>
    <input id="file-input" type="file">

    <div class="file-meta" id="file-meta"></div>

    <div class="actions">
      <button id="start" disabled>Start upload</button>
      <button id="pause" class="secondary" disabled>Pause</button>
      <button id="resume" class="secondary" disabled>Resume</button>
    </div>

    <progress id="progress" value="0" max="100"></progress>
    <div id="percent">0%</div>

    <p id="status" aria-live="polite">No file selected.</p>
    <pre id="log"></pre>
  </main>

  <script src="uploader.js"></script>
  <script>
    const $ = (sel) => document.querySelector(sel);
    const zone = $('#drop-zone');
    const input = $('#file-input');
    const startBtn = $('#start');
    const pauseBtn = $('#pause');
    const resumeBtn = $('#resume');
    const progress = $('#progress');
    const percent = $('#percent');
    const status = $('#status');
    const logEl = $('#log');
    const fileMeta = $('#file-meta');

    let selectedFile = null;
    let uploader = null;

    const log = (message) => {
      const line = `[${new Date().toLocaleTimeString()}] ${message}`;
      logEl.textContent = (logEl.textContent ? logEl.textContent + '\n' : '') + line;
      logEl.scrollTop = logEl.scrollHeight;
    };

    const setProgress = (value) => {
      progress.value = value;
      percent.textContent = `${Math.round(value)}%`;
    };

    const select = (file) => {
      if (!file) return;
      selectedFile = file;
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      resumeBtn.disabled = true;
      setProgress(0);
      fileMeta.textContent = `${file.name} · ${(file.size / (1024 * 1024)).toFixed(2)} MiB · ${Math.max(1, Math.ceil(file.size / (2 * 1024 * 1024)))} chunks`;
      status.textContent = `Ready: ${file.name}`;
      logEl.textContent = '';
      log(`Selected ${file.name} (${file.size} bytes)`);
    };

    zone.addEventListener('click', () => input.click());
    zone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
    input.addEventListener('change', () => select(input.files[0]));

    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragging'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragging'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('dragging');
      if (e.dataTransfer.files.length > 0) select(e.dataTransfer.files[0]);
    });

    startBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      resumeBtn.disabled = true;
      status.textContent = 'Uploading…';
      log('Starting upload');

      uploader = new ChunkedUploader({
        file: selectedFile,
        endpoint: '/upload',
        token: document.querySelector('meta[name="upload-token"]')?.content || '',
        onProgress: (value, index) => {
          setProgress(value);
          status.textContent = `Uploading ${Math.round(value)}% (chunk ${index + 1}/${uploader.totalChunks})`;
        },
        onSuccess: (result) => {
          status.textContent = 'Upload complete.';
          setProgress(100);
          pauseBtn.disabled = true;
          resumeBtn.disabled = true;
          log(`Upload ${result.identifier} completed successfully`);
        },
        onError: (error) => {
          status.textContent = `Error: ${error.message}`;
          log(`Error: ${error.message}`);
        },
      });

      try {
        await uploader.start();
      } catch (error) {
        pauseBtn.disabled = true;
        resumeBtn.disabled = false;
        status.textContent = `Stopped: ${error.message}`;
      }
    });

    pauseBtn.addEventListener('click', () => {
      uploader?.pause();
      pauseBtn.disabled = true;
      resumeBtn.disabled = false;
      status.textContent = 'Paused — resume at any time.';
      log('Paused by user');
    });

    resumeBtn.addEventListener('click', async () => {
      pauseBtn.disabled = false;
      resumeBtn.disabled = true;
      status.textContent = 'Resuming…';
      log('Resuming upload');
      try {
        await uploader?.resume();
      } catch (error) {
        pauseBtn.disabled = true;
        resumeBtn.disabled = false;
        status.textContent = `Stopped: ${error.message}`;
      }
    });
  </script>
</body>
</html>
